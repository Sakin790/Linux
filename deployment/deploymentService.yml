# ==========================================
# 1. DEPLOYMENT CONFIGURATION
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  namespace: default
  labels:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/instance: my-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: e-commerce
spec:
  replicas: 2
  
  # Zero-Downtime Deployment Strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # Selector দিয়ে পডগুলোকে চেনা হবে
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
      app.kubernetes.io/instance: my-app-prod

  # Pod Template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
        app.kubernetes.io/instance: my-app-prod
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: e-commerce
    spec:
      # Security Best Practice: Non-root Container
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001

      containers:
      - name: web
        image: hashicorp/http-echo:1.0.0
        args:
        - "-text=Hello! Production Ready App is Running!"
        
        # Resource Requests & Limits
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

        # Health Checks
        readinessProbe:
          tcpSocket:
            port: 5678
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 5678
          initialDelaySeconds: 15
          periodSeconds: 10

        ports:
        - name: http-port
          containerPort: 5678

---
# ==========================================
# 2. SERVICE CONFIGURATION
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: default
  labels:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/instance: my-app-prod
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: e-commerce
spec:
  type: ClusterIP  # ইন্টারনাল প্রোডাকশন সার্ভিস
  
  # Matching Selector: সার্ভিস ঠিক এই লেবেলের পডগুলোকেই খুঁজে নেবে
  selector:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/instance: my-app-prod

  ports:
    - name: http
      protocol: TCP
      port: 80         # সার্ভিসের নিজস্ব Virtual Port
      targetPort: 5678 # Deployment-এর containerPort (5678)
